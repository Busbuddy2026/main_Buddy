document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ont-size:11.5px; color:#8b919b; font-family:'IBM Plex Mono', monospace; padding-top:2px\">{{ t.time }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div sc-camel-on-click=\"{{ goAbsence }}\" style=\"margin-top:16px; display:flex; align-items:center; gap:13px; padding:16px 18px; border:1px solid #e4e7eb; border-radius:18px; cursor:pointer\" style-hover=\"background:#fafbfc\">\n            <div style=\"width:34px; height:34px; border-radius:11px; background:#f6f7f9; color:#5f6672; display:grid; place-items:center; font-family:'Material Symbols Rounded'; font-size:19px\">event_busy<\u002Fdiv>\n            <div style=\"flex:1\">\n              <div style=\"font-size:13.5px; font-weight:600\">Not using transport?<\u002Fdiv>\n              <div style=\"font-size:12px; color:#8b919b; margin-top:1px\">Tell the school and the bus attendant.<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-family:'Material Symbols Rounded'; font-size:20px; color:#8b919b\">chevron_right<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ is_track }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:relative; height:100%; min-height:640px\">\n          <x-import component-from-global-scope=\"live-map\" from=\"a266a8ff-ca0e-421e-86f0-6cc154c76727#/live-map.js\" focus=\"12\" selected=\"12\" hint-size=\"100%,100%\"><\u002Fx-import>\n          <div style=\"position:absolute; top:14px; left:16px; right:16px; z-index:500; display:flex; align-items:center; gap:10px\">\n            <div sc-camel-on-click=\"{{ goHome }}\" style=\"width:38px; height:38px; border-radius:12px; background:#fff; display:grid; place-items:center; box-shadow:0 2px 10px rgba(16,24,40,.16); cursor:pointer\">\n              <span style=\"font-family:'Material Symbols Rounded'; font-size:20px\">arrow_back<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1; padding:9px 14px; border-radius:12px; background:#fff; box-shadow:0 2px 10px rgba(16,24,40,.16)\">\n              <div style=\"font-size:13px; font-weight:600\">Bus 12 · Live<\u002Fdiv>\n              <div style=\"font-size:11px; color:#8b919b\">Kondapur → School<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute; left:14px; right:14px; bottom:14px; z-index:500; background:#fff; border-radius:20px; padding:18px; box-shadow:0 10px 34px rgba(16,24,40,.2)\">\n            <div style=\"display:flex; align-items:center; gap:10px\">\n              <div style=\"font-size:17px; font-weight:600; letter-spacing:-.02em\">Bus 12<\u002Fdiv>\n              <div style=\"display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:99px; background:#e8f0fe; color:#1558b8; font-size:11.5px; font-weight:600\">\n                <span style=\"width:6px; height:6px; border-radius:50%; background:#1a73e8\"><\u002Fspan>On the way\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px\">\n              <div>\n                <div style=\"font-size:10.5px; color:#8b919b\">DISTANCE FROM YOUR STOP<\u002Fdiv>\n                <div style=\"font-size:20px; font-weight:600; font-family:'IBM Plex Mono', monospace; letter-spacing:-.02em\">2.3 km<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:10.5px; color:#8b919b\">ESTIMATED ARRIVAL<\u002Fdiv>\n                <div style=\"font-size:20px; font-weight:600; font-family:'IBM Plex Mono', monospace; letter-spacing:-.02em; color:#1a73e8\">7 min<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:9px; margin-top:16px; padding:12px 13px; border-radius:13px; background:#f6f7f9\">\n              <span style=\"font-family:'Material Symbols Rounded'; font-size:19px; color:#5f6672\">location_on<\u002Fspan>\n              <div>\n                <div style=\"font-size:10.5px; color:#8b919b\">NEXT STOP<\u002Fdiv>\n                <div style=\"font-size:13px; font-weight:600\">Green Valley Apartments<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px; color:#8b919b; margin-top:12px\">{{ child.name }} boarded at 6:42 AM and is onboard now.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ is_alerts }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:14px 20px 20px\">\n          <div style=\"font-size:22px; font-weight:600; letter-spacing:-.02em\">Notifications<\u002Fdiv>\n          <div style=\"display:flex; gap:7px; margin-top:14px\">\n            <sc-for list=\"{{ notifTabs }}\" as=\"n\" hint-placeholder-count=\"3\">\n              <div style=\"padding:7px 13px; border-radius:99px; font-size:12.5px; font-weight:500; cursor:pointer; background:{{ n.bg }}; color:{{ n.fg }}; border:1px solid {{ n.bd }}\">{{ n.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px; display:flex; flex-direction:column\">\n            <sc-for list=\"{{ notifs }}\" as=\"n\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex; gap:13px; padding:15px 0; border-bottom:1px solid #f3f4f6\">\n                <div style=\"width:34px; height:34px; border-radius:11px; flex:none; display:grid; place-items:center; background:{{ n.bg }}; color:{{ n.fg }}\">\n                  <span style=\"font-family:'Material Symbols Rounded'; font-size:19px\">{{ n.icon }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"flex:1; min-width:0\">\n                  <div style=\"font-size:13.5px; font-weight:600; letter-spacing:-.005em\">{{ n.title }}<\u002Fdiv>\n                  <div style=\"font-size:12px; color:#5f6672; margin-top:2px; line-height:1.45; text-wrap:pretty\">{{ n.body }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11px; color:#8b919b; font-family:'IBM Plex Mono', monospace; flex:none\">{{ n.time }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ is_history }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:14px 20px 20px\">\n          <div style=\"font-size:22px; font-weight:600; letter-spacing:-.02em\">Transport history<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:#8b919b; margin-top:3px\">{{ child.name }} · Bus 12<\u002Fdiv>\n          <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <div style=\"margin-top:20px; border:1px solid #e4e7eb; border-radius:18px; overflow:hidden\">\n              <div style=\"padding:13px 16px; border-bottom:1px solid #f3f4f6; display:flex; align-items:center; justify-content:space-between\">\n                <div style=\"font-size:13.5px; font-weight:600\">{{ d.label }}<\u002Fdiv>\n                <div style=\"display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:99px; font-size:11px; font-weight:600; background:{{ d.tone.bg }}; color:{{ d.tone.fg }}\">\n                  <span style=\"width:6px; height:6px; border-radius:50%; background:{{ d.tone.dot }}\"><\u002Fspan>{{ d.status }}\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:14px 16px\">\n                <sc-for list=\"{{ d.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid; grid-template-columns:66px minmax(0,1fr); gap:12px; padding:6px 0\">\n                    <div style=\"font-size:12px; color:#8b919b; font-family:'IBM Plex Mono', monospace\">{{ r.time }}<\u002Fdiv>\n                    <div style=\"font-size:13px; font-weight:500\">{{ r.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ is_absence }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:14px 20px 20px\">\n          <div style=\"display:flex; align-items:center; gap:12px\">\n            <div sc-camel-on-click=\"{{ goHome }}\" style=\"width:36px; height:36px; border-radius:12px; border:1px solid #e4e7eb; display:grid; place-items:center; cursor:pointer\">\n              <span style=\"font-family:'Material Symbols Rounded'; font-size:19px\">arrow_back<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:19px; font-weight:600; letter-spacing:-.02em\">Transport absence<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:13px; color:#5f6672; margin-top:12px; line-height:1.5; text-wrap:pretty\">Let the school and Bus 12's attendant know that {{ child.first }} will not use transport.<\u002Fdiv>\n\n          <div style=\"margin-top:20px; border:1px solid #e4e7eb; border-radius:16px; padding:15px 16px; display:flex; align-items:center; justify-content:space-between\">\n            <div><div style=\"font-size:10.5px; color:#8b919b\">DATE<\u002Fdiv><div style=\"font-size:14px; font-weight:600\">Wednesday, 9 September<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-family:'Material Symbols Rounded'; font-size:20px; color:#5f6672\">calendar_today<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:14px; display:flex; flex-direction:column; gap:12px\">\n            <sc-for list=\"{{ tripToggles }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <div style=\"border:1px solid #e4e7eb; border-radius:16px; padding:15px 16px\">\n                <div style=\"font-size:13.5px; font-weight:600\">{{ t.label }}<\u002Fdiv>\n                <div style=\"font-size:11.5px; color:#8b919b; margin-top:2px\">{{ t.sub }}<\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px\">\n                  <div sc-camel-on-click=\"{{ t.onUse }}\" style=\"padding:11px 0; text-align:center; border-radius:12px; font-size:12.5px; font-weight:600; cursor:pointer; background:{{ t.useBg }}; color:{{ t.useFg }}; border:1px solid {{ t.useBd }}\">Using bus<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ t.onSkip }}\" style=\"padding:11px 0; text-align:center; border-radius:12px; font-size:12.5px; font-weight:600; cursor:pointer; background:{{ t.skipBg }}; color:{{ t.skipFg }}; border:1px solid {{ t.skipBd }}\">Not using<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:14px; border:1px solid #e4e7eb; border-radius:16px; padding:15px 16px\">\n            <div style=\"font-size:10.5px; color:#8b919b\">REASON (OPTIONAL)<\u002Fdiv>\n            <div style=\"font-size:13px; color:#a8aeb7; margin-top:6px\">Going with family<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:18px; padding:15px 0; text-align:center; border-radius:14px; background:#1a73e8; color:#fff; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"background:#1558b8\">Submit<\u002Fdiv>\n          <div style=\"font-size:11.5px; color:#8b919b; margin-top:12px; text-align:center\">Visible immediately to the school office and Suresh Kumar.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <div style=\"border-top:1px solid #eceef1; background:#fff; padding:8px 10px 14px; display:grid; grid-template-columns:repeat(4,1fr); gap:2px\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ t.on }}\" style=\"padding:8px 0 5px; text-align:center; border-radius:12px; cursor:pointer; color:{{ t.fg }}\">\n          <div style=\"font-family:'Material Symbols Rounded'; font-size:23px; line-height:1\">{{ t.icon }}<\u002Fdiv>\n          <div style=\"font-size:10.5px; font-weight:{{ t.fw }}; margin-top:4px\">{{ t.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:900},&quot;homeLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Map first&quot;,&quot;Status first&quot;],&quot;default&quot;:&quot;Map first&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: 'home', child: 'Aarav' };\n\n  CHILDREN = [\n    { first: 'Aarav', name: 'Aarav Kumar', initial: 'A' },\n    { first: 'Diya', name: 'Diya Sharma', initial: 'D' }\n  ];\n\n  TABS = [\n    { id: 'home', label: 'Home', icon: 'home' },\n    { id: 'track', label: 'Track', icon: 'near_me' },\n    { id: 'alerts', label: 'Alerts', icon: 'notifications' },\n    { id: 'history', label: 'History', icon: 'history' }\n  ];\n\n  go = (p) => this.setState({ page: p });\n\n  renderVals() {\n    const p = this.state.page;\n    const flags = {};\n    ['home', 'track', 'alerts', 'history', 'absence'].forEach(k => { flags['is_' + k] = p === k; });\n\n    const children = this.CHILDREN.map(c => {\n      const on = this.state.child === c.first;\n      return { ...c, on: () => this.setState({ child: c.first }),\n        bd: on ? '#1a73e8' : '#e4e7eb', bg: on ? '#e8f0fe' : '#fff',\n        fg: on ? '#1558b8' : '#3c4149',\n        avBg: on ? '#1a73e8' : '#f1f3f4', avFg: on ? '#fff' : '#5f6672' };\n    });\n    const child = this.CHILDREN.find(c => c.first === this.state.child) || this.CHILDREN[0];\n\n    const steps = [\n      { title: 'Bus started from depot', time: '6:20 AM', state: 'done' },\n      { title: 'Bus approaching your stop', time: '6:38 AM', state: 'done' },\n      { title: child.first + ' boarded the bus', time: '6:42 AM', state: 'done' },\n      { title: 'On the way to school', time: 'Now', state: 'now' },\n      { title: 'Reached school', time: '7:50 AM', state: 'todo' }\n    ];\n    const timeline = steps.map(s => ({\n      title: s.title, time: s.time,\n      dotBg: s.state === 'done' ? '#1e8e3e' : s.state === 'now' ? '#1a73e8' : '#fff',\n      dotBd: s.state === 'done' ? '#1e8e3e' : s.state === 'now' ? '#1a73e8' : '#dadce0',\n      glyph: s.state === 'done' ? 'check' : '',\n      line: s.state === 'done' ? '#cfe3d6' : '#eceef1',\n      fg: s.state === 'todo' ? '#8b919b' : '#16181b',\n      fw: s.state === 'now' ? 600 : 500\n    }));\n\n    const tabs = this.TABS.map(t => ({\n      ...t, on: () => this.go(t.id),\n      fg: p === t.id ? '#1a73e8' : '#8b919b',\n      fw: p === t.id ? 600 : 500\n    }));\n\n    const notifTabs = ['All', 'Transport', 'Attendance', 'Alerts'].map((l, i) => ({\n      label: l, bg: i === 0 ? '#16181b' : '#fff', fg: i === 0 ? '#fff' : '#3c4149', bd: i === 0 ? '#16181b' : '#e4e7eb'\n    }));\n\n    const notifs = [\n      { icon: 'directions_bus', title: 'Bus 12 has started', body: 'Morning trip from Kondapur depot has begun.', time: '6:20 AM', bg: '#e8f0fe', fg: '#1558b8' },\n      { icon: 'near_me', title: 'Bus is approaching your stop', body: 'Green Valley Apartments in about 4 minutes.', time: '6:38 AM', bg: '#e8f0fe', fg: '#1558b8' },\n      { icon: 'how_to_reg', title: child.first + ' boarded the bus', body: 'Marked by attendant Suresh Kumar at Green Valley Apartments.', time: '6:42 AM', bg: '#e6f4ea', fg: '#186c33' },\n      { icon: 'school', title: child.first + ' reached school safely', body: 'Bus 12 arrived at Greenfield International School.', time: '7:35 AM', bg: '#e6f4ea', fg: '#186c33' },\n      { icon: 'schedule', title: 'Return bus delayed by 10 minutes', body: 'Traffic near Gachibowli flyover. New arrival about 4:42 PM.', time: 'Yesterday', bg: '#fef7e0', fg: '#8f5b00' },\n      { icon: 'alt_route', title: 'Route change for 10 September', body: 'Road work on Botanical Garden road. Pickup moves 5 minutes earlier.', time: 'Yesterday', bg: '#f1f3f4', fg: '#5f6672' }\n    ];\n\n    const days = [\n      { label: 'Today · 8 September', status: 'In progress', tone: { bg: '#e8f0fe', fg: '#1558b8', dot: '#1a73e8' }, rows: [\n        { time: '6:42 AM', label: 'Boarded bus at Green Valley Apartments' },\n        { time: '7:35 AM', label: 'Reached school' },\n        { time: '3:48 PM', label: 'Return trip scheduled' } ] },\n      { label: 'Monday · 7 September', status: 'Completed', tone: { bg: '#e6f4ea', fg: '#186c33', dot: '#1e8e3e' }, rows: [\n        { time: '6:40 AM', label: 'Boarded bus' },\n        { time: '7:32 AM', label: 'Reached school' },\n        { time: '3:48 PM', label: 'Boarded return bus' },\n        { time: '4:32 PM', label: 'Dropped safely' } ] },\n      { label: 'Friday · 5 September', status: 'Absent', tone: { bg: '#fce8e6', fg: '#c5221f', dot: '#d93025' }, rows: [\n        { time: '6:35 AM', label: 'Marked absent by attendant' },\n        { time: '—', label: 'Transport not used' } ] }\n    ];\n\n    const tripToggles = [\n      { label: 'Morning trip', sub: 'Pickup 6:38 AM · Green Valley Apartments',\n        useBg: '#fff', useFg: '#3c4149', useBd: '#e4e7eb',\n        skipBg: '#fce8e6', skipFg: '#c5221f', skipBd: '#f7c8c4',\n        onUse: () => {}, onSkip: () => {} },\n      { label: 'Evening trip', sub: 'Drop 4:32 PM · Green Valley Apartments',\n        useBg: '#e8f0fe', useFg: '#1558b8', useBd: '#1a73e8',\n        skipBg: '#fff', skipFg: '#3c4149', skipBd: '#e4e7eb',\n        onUse: () => {}, onSkip: () => {} }\n    ];\n\n    const statusFirst = (this.props.homeLayout ?? 'Map first') === 'Status first';\n\n    return {\n      ...flags, children, child, timeline, tabs, notifTabs, notifs, days, tripToggles,\n      statusFirst, mapFirst: !statusFirst,\n      goTrack: () => this.go('track'), goAlerts: () => this.go('alerts'),\n      goAbsence: () => this.go('absence'), goHome: () => this.go('home'),\n      goHistory: () => this.go('history')\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
